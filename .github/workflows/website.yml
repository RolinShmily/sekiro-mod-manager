name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'skills/smm-cli/**'
      - 'wrangler.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'skills/smm-cli/**'
      - 'wrangler.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/website.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the verified static site to Cloudflare Workers'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Refresh public release snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/RolinShmily/sekiro-mod-manager/releases/latest > website/public/release.json.new
          mv website/public/release.json.new website/public/release.json
      - name: Test release parsing and type-check
        run: |
          pnpm --filter sekiro-mod-manager-website test
          pnpm --filter sekiro-mod-manager-website lint
      - name: Build static website, license report, and skill ZIP
        run: pnpm --filter sekiro-mod-manager-website build
      - uses: actions/upload-artifact@v4
        with:
          name: smm-website
          path: website/dist
      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Secret values pasted from the dashboard may contain trailing newlines.
          # Normalize without printing credentials into the job log.
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          pnpm dlx wrangler@4.147.0 deploy --config wrangler.toml

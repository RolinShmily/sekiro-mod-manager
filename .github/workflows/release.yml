name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Validate SemVer tag format
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Triggered tag: ${TAG}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${TAG}' does not match required semver format v0.0.1 (regex: ^v[0-9]+\.[0-9]+\.[0-9]+$)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          $match = [regex]::Match($cmake, 'project\(sekiro_mod_manager VERSION ([0-9]+\.[0-9]+\.[0-9]+)')
          if (-not $match.Success -or "v$($match.Groups[1].Value)" -ne $env:GITHUB_REF_NAME) {
            throw "Release tag does not match the CMake project version."
          }

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Patch Submodules
        run: |
          python tools/patch_huskarui.py

      - name: Configure CMake
        run: |
          cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build Release Targets
        run: |
          cmake --build build --config Release

      - name: Verify built binary versions
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $cliVersion = & ./build/src/cli/smm.exe --version
          if ($LASTEXITCODE -ne 0 -or $cliVersion.Trim() -ne "smm (Sekiro Mod Manager) $version") {
            throw "CLI version does not match the release tag."
          }
          $guiVersion = (Get-Item ./build/src/gui/smm_gui.exe).VersionInfo
          if ($guiVersion.FileVersion -ne "$version.0" -or $guiVersion.ProductVersion -ne "$version.0") {
            throw "GUI file version does not match the release tag."
          }
          $numeric = "$($guiVersion.FileMajorPart).$($guiVersion.FileMinorPart).$($guiVersion.FileBuildPart).$($guiVersion.FilePrivatePart)"
          if ($numeric -ne "$version.0") { throw "GUI numeric file version does not match." }

      - name: Package CLI, GUI, and Setup Installer
        shell: pwsh
        run: |
          $qtBin = "$env:QT_ROOT_DIR/bin"
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null

          # 1. Package Standalone CLI Tool
          $cliDir = "dist/sekiro-mod-manager-${{ github.ref_name }}-windows-x64-cli"
          New-Item -ItemType Directory -Path $cliDir -Force | Out-Null
          Copy-Item "build/src/cli/smm.exe" -Destination "$cliDir/smm.exe"
          Copy-Item "LICENSE" -Destination "$cliDir/"
          Copy-Item "THIRD_PARTY_NOTICES.md" -Destination "$cliDir/"
          Copy-Item "README.md" -Destination "$cliDir/"
          Copy-Item "README.zh-CN.md" -Destination "$cliDir/"
          $cliZip = "dist/sekiro-mod-manager-${{ github.ref_name }}-windows-x64-cli.zip"
          Compress-Archive -Path "$cliDir" -DestinationPath $cliZip -Force

          # 2. Package Standalone GUI Portable Bundle
          $guiDir = "dist/sekiro-mod-manager-${{ github.ref_name }}-windows-x64-gui"
          New-Item -ItemType Directory -Path $guiDir -Force | Out-Null
          Copy-Item "build/src/gui/smm_gui.exe" -Destination "$guiDir/SekiroModManager.exe"
          Copy-Item "build/src/cli/smm.exe" -Destination "$guiDir/smm.exe"
          Copy-Item "LICENSE" -Destination "$guiDir/"
          Copy-Item "THIRD_PARTY_NOTICES.md" -Destination "$guiDir/"
          Copy-Item "README.md" -Destination "$guiDir/"
          Copy-Item "README.zh-CN.md" -Destination "$guiDir/"

          & "$qtBin/windeployqt.exe" --qmldir "src/gui/qml" --release --no-translations --no-opengl-sw --compiler-runtime "$guiDir/SekiroModManager.exe"

          # Slim down bundle by pruning unused software rasterizers, redundant styles, and system-inbox DLLs
          Remove-Item -Path "$guiDir/opengl32sw.dll" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$guiDir/D3Dcompiler_47.dll" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$guiDir/Qt6OpenGL.dll" -Force -ErrorAction SilentlyContinue

          $unusedStyles = @("FluentWinUI3", "Imagine", "Material", "Universal", "Fusion")
          foreach ($style in $unusedStyles) {
              Remove-Item -Path "$guiDir/qml/QtQuick/Controls/$style" -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item -Path "$guiDir/Qt6QuickControls2$style.dll" -Force -ErrorAction SilentlyContinue
          }

          $guiZip = "dist/sekiro-mod-manager-${{ github.ref_name }}-windows-x64-gui.zip"
          Compress-Archive -Path "$guiDir" -DestinationPath $guiZip -Force

          # 3. Build Windows Setup Installer with Inno Setup
          $absGuiDir = (Resolve-Path "$guiDir").Path
          $absDistDir = (Resolve-Path "dist").Path
          ISCC.exe /DMyAppVersion="${{ github.ref_name }}" /DSourceDir="$absGuiDir" /DOutputDir="$absDistDir" installer/installer.iss

          # 4. Calculate SHA-256 for GUI Zip and generate latest.json update manifest
          $sha256 = (Get-FileHash -Path $guiZip -Algorithm SHA256).Hash.ToLower()
          $version = "${{ github.ref_name }}".TrimStart('v')
          $latest = @{
              version = $version
              published_at = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/sekiro-mod-manager-${{ github.ref_name }}-windows-x64-gui.zip"
              sha256 = $sha256
              notes_zh = "Sekiro Mod Manager ${{ github.ref_name }} 发布"
              notes_en = "Sekiro Mod Manager ${{ github.ref_name }} Release"
          } | ConvertTo-Json -Depth 4
          $latest | Set-Content -Path "dist/latest.json" -Encoding utf8

          # Publish the release-specific bilingual changelog, not a commit title dump.
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)"
          $notes = [regex]::Match($changelog, $pattern)
          if (-not $notes.Success) { throw "Missing release changelog for $version." }
          $notes.Groups[1].Value.Trim() | Set-Content "dist/release-notes.md" -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
            dist/latest.json
          draft: false
          prerelease: false
          body_path: dist/release-notes.md
          generate_release_notes: false

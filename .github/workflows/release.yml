name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate Tag & Changelog
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate SemVer tag, CMake version & CHANGELOG
        id: tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VER="${BASH_REMATCH[1]}"
            echo "version=${VER}" >> "$GITHUB_OUTPUT"

            CMAKE_VER=$(grep -oP 'set\(SMM_APP_VERSION "\K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt || true)
            if [[ "${CMAKE_VER}" != "${VER}" ]]; then
              echo "::error::Tag v${VER} does not match SMM_APP_VERSION (${CMAKE_VER}) in CMakeLists.txt"
              exit 1
            fi

            if ! grep -qE "^## \[${VER}\]" CHANGELOG.md; then
              echo "::error::Missing CHANGELOG.md entry for [${VER}]"
              exit 1
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tag '${TAG}' does not match required semver format vMAJOR.MINOR.PATCH"
            exit 1
          fi

  build:
    name: Build Windows Artifacts
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/release/*
          draft: false
          prerelease: false
          generate_release_notes: false

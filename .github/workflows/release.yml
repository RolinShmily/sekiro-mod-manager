name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Validate SemVer tag format
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Triggered tag: ${TAG}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${TAG}' does not match required semver format v0.0.1 (regex: ^v[0-9]+\.[0-9]+\.[0-9]+$)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Patch Submodules
        run: |
          python tools/patch_huskarui.py

      - name: Configure CMake
        run: |
          cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build Release Targets
        run: |
          cmake --build build --config Release

      - name: Package Standalone GUI with windeployqt
        shell: pwsh
        run: |
          $qtBin = "$env:QT_ROOT_DIR/bin"
          $outDir = "dist/SekiroModManager-${{ github.ref_name }}"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          
          Copy-Item "build/src/gui/smm_gui.exe" -Destination "$outDir/SekiroModManager.exe"
          Copy-Item "build/src/cli/smm.exe" -Destination "$outDir/smm.exe"
          Copy-Item "LICENSE" -Destination "$outDir/"
          Copy-Item "THIRD_PARTY_NOTICES.md" -Destination "$outDir/"
          Copy-Item "README.md" -Destination "$outDir/"
          Copy-Item "README.zh-CN.md" -Destination "$outDir/"

          & "$qtBin/windeployqt.exe" --qmldir "src/gui/qml" --release --no-translations --compiler-runtime "$outDir/SekiroModManager.exe"

          $zipPath = "dist/SekiroModManager-${{ github.ref_name }}-windows-x64.zip"
          Compress-Archive -Path "$outDir" -DestinationPath $zipPath -Force

          # Calculate SHA-256 and generate latest.json update manifest
          $sha256 = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
          $version = "${{ github.ref_name }}".TrimStart('v')
          $latest = @{
              version = $version
              published_at = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SekiroModManager-${{ github.ref_name }}-windows-x64.zip"
              sha256 = $sha256
              notes_zh = "Sekiro Mod Manager ${{ github.ref_name }} 发布"
              notes_en = "Sekiro Mod Manager ${{ github.ref_name }} Release"
          } | ConvertTo-Json -Depth 4
          $latest | Set-Content -Path "dist/latest.json" -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/latest.json
          draft: false
          prerelease: false
          generate_release_notes: true

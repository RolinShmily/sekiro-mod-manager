name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Installer & Publish Release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Validate SemVer tag format
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Triggered tag: ${TAG}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${TAG}' does not match required semver format v0.0.1 (regex: ^v[0-9]+\.[0-9]+\.[0-9]+$)"
            exit 1
          fi
          echo "Tag format validated successfully: ${TAG}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend bundle
        run: pnpm --filter smm-desktop build

      - name: Verify subset font artifacts
        shell: bash
        run: |
          # smm-desktop build 前置运行 scripts/subset-fonts.mjs（按量子集化）；此处断言产物齐全非空
          for f in inter-400 inter-500 inter-600 inter-700 jetbrains-mono-400 jetbrains-mono-700 noto-sans-sc-400 noto-sans-sc-600 noto-sans-sc-700; do
            [ -s "apps/smm-desktop/dist/fonts/$f.woff2" ] || { echo "::error::subset font artifact missing or empty: $f.woff2"; exit 1; }
          done
          echo "All 9 subset font artifacts present in dist/fonts."

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run packaging pipeline (setup.exe)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build-installer.ps1

      - name: Determine tag name
        id: tag
        shell: bash
        run: |
          echo "val=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        # pwsh (PowerShell 7) is required, not Windows PowerShell 5.1: this step writes
        # non-ASCII text (Chinese, emoji) and 5.1 reads the BOM-less script file using the
        # ANSI/CP1252 codepage, which mangled every generated release note up to v0.1.7.
        shell: pwsh
        run: |
          $checksumContent = Get-Content "dist-installer\SHA256SUMS.txt" -Raw
          $tag = "${{ steps.tag.outputs.val }}"
          $body = @"
          ## Sekiro Mod Manager (SMM) Release $tag

          High-Performance, Zero-Disk-Copy Desktop Mod Manager & Automation Core for *Sekiro: Shadows Die Twice*.

          ### Included Assets
          - **Sekiro-Mod-Manager.exe**: Standalone portable desktop GUI (免安装绿色独立程序，双击即用).
          - **Sekiro-Mod-Manager-Setup.exe**: Windows setup installer (Windows 安装向导版).
          - **smm-cli.exe**: Standalone CLI executable for AI-Agents and terminal scripting (命令行工具).
          - **SHA256SUMS.txt**: Cryptographic integrity verification hashes (校验哈希清单).
          - **LICENSE / licenses/**: MIT text with the full scope declaration, plus every third-party license text (开源范围声明与第三方许可证全文). The Setup installer also places these at ``<install directory>\licenses\`` alongside ``smm.exe``.

          ### Core Highlights
          - ⚡ **Win32 NTFS Hard Link Deployment**: Millisecond-level projection into game ``mods/`` directory with zero disk space cost.
          - 🛡️ **Pristine Rollback**: One-click restore strictly driven by ``.smm_manifest.json``.
          - 🔍 **Heuristic Normalization**: Automated unnesting and standard FromSoftware folder re-alignment.
          - ⚠️ **Three-Tier Semantic Conflict Detection**: Balance collision warnings (``gameparam``) and weapon/skin exclusivity.
          - 📦 **Modpack Bundling & Provenance**: Full ``.smmpack`` bundle import/export and Nexus Mods source tracking.
          - 🤖 **AI-Agent Ready**: Direct terminal invocation via ``smm-cli``.

          ### SHA-256 Checksums
          ````text
          $checksumContent
          ````
          "@
          Set-Content -Path "RELEASE_NOTES.md" -Value $body -Encoding utf8NoBOM

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.val }}
          name: Sekiro Mod Manager ${{ steps.tag.outputs.val }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist-installer/Sekiro-Mod-Manager.exe
            dist-installer/Sekiro-Mod-Manager-Setup.exe
            dist-installer/smm-cli.exe
            dist-installer/SHA256SUMS.txt
            dist-installer/LICENSE
            dist-installer/licenses/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

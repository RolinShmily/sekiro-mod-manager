name: CI

on:
  push:
    branches:
      - main
      - refactor/*
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (MSVC C++17 + Qt 6)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Patch Submodules
        run: |
          python scripts/patch_huskarui.py

      - name: Configure CMake
        run: |
          # SMM_BUILD_TESTS builds the headless regression suites (core business rules,
          # CoreService adapter, update feed). Without it a PR compiles but verifies nothing.
          cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DSMM_BUILD_TESTS=ON

      - name: Build All Targets
        run: |
          cmake --build build --config Release

      - name: Run Regression Tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: CLI Smoke Test
        run: |
          ./build/src/cli/smm.exe --help
          ./build/src/cli/smm.exe doctor --json

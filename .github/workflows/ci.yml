name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Lint, Test & Frontend Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust with Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build frontend bundle
        run: pnpm --filter smm-desktop build

      - name: Verify subset font artifacts
        shell: bash
        run: |
          # smm-desktop build 前置运行 scripts/subset-fonts.mjs（按量子集化）；此处断言产物齐全非空
          for f in inter-400 inter-500 inter-600 inter-700 jetbrains-mono-400 jetbrains-mono-700 noto-sans-sc-400 noto-sans-sc-600 noto-sans-sc-700; do
            [ -s "apps/smm-desktop/dist/fonts/$f.woff2" ] || { echo "::error::subset font artifact missing or empty: $f.woff2"; exit 1; }
          done
          echo "All 9 subset font artifacts present in dist/fonts."

      - name: Run workspace tests
        run: cargo test --workspace --locked --verbose

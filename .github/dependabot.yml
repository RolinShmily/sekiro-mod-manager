version: 2

updates:
  # Rust crates (workspace root, covers every member crate via Cargo.lock).
  - package-ecosystem: cargo
    directory: /
    schedule:
      # Pinned so that editing this file cannot start a second, overlapping batch.
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Major upgrades expect a real migration and a human decision, so they are
      # never opened automatically. Bump them deliberately when ready.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # pnpm workspace — the lockfile lives at the repository root.
  - package-ecosystem: npm
    directory: /
    schedule:
      # See the cargo entry: a pinned slot keeps runs predictable.
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # See the cargo entry: majors are bumped by hand, not by Dependabot.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # GitHub Actions publish a floating major tag (v4 -> v7), so a major bump is the
  # normal, expected signal here and is deliberately NOT ignored.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      # See the cargo entry: a pinned slot keeps runs predictable.
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Shanghai
    commit-message:
      prefix: "chore(ci)"

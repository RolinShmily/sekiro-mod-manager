<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 · Sekiro Mod Manager</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-content: center;
        gap: 14px;
        padding: 32px;
        background: #0a0b0d;
        color: #f4f5f7;
        font-family: "Inter", "Segoe UI", "Microsoft YaHei UI", system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      p.eyebrow {
        margin: 0;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 12px;
        letter-spacing: 0.14em;
        color: #d4a853;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.5rem, 4vw, 2.25rem);
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p.desc {
        margin: 0;
        font-size: 14px;
        color: #9ca3af;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 8px;
        padding: 10px 18px;
        border-radius: 10px;
        background: #d4a853;
        color: #0a0b0d;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        background: #e5be6d;
      }
    </style>
  </head>
  <body>
    <p class="eyebrow">404 · NOT FOUND</p>
    <h1>页面不存在 / Page Not Found</h1>
    <p class="desc">你访问的路径无效或已移动。</p>
    <div><a href="/">返回首页 · Back to Home</a></div>
  </body>
</html>
